<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="icon-bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <linearGradient id="bridge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#icon-bg)" stroke="#334155" stroke-width="4"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="#38bdf8" fill-opacity="0.08" filter="url(#neon-glow)" />

  <!-- Web Browser Window (Top-Left) -->
  <g transform="translate(110, 120)">
    <rect width="130" height="110" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="5" filter="url(#neon-glow)"/>
    <circle cx="26" cy="24" r="6" fill="#ef4444" />
    <circle cx="44" cy="24" r="6" fill="#f59e0b" />
    <circle cx="62" cy="24" r="6" fill="#10b981" />
    <line x1="20" y1="52" x2="110" y2="52" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <line x1="20" y1="74" x2="80" y2="74" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- MCP Agent Node (Bottom-Right) -->
  <g transform="translate(272, 282)">
    <rect width="130" height="110" rx="20" fill="#1e1b4b" stroke="#a855f7" stroke-width="5" filter="url(#neon-glow)"/>
    <!-- Core Hub -->
    <circle cx="65" cy="55" r="18" fill="#c084fc" filter="url(#neon-glow)"/>
    <circle cx="32" cy="30" r="7" fill="#818cf8"/>
    <circle cx="98" cy="30" r="7" fill="#818cf8"/>
    <circle cx="65" cy="85" r="7" fill="#818cf8"/>
    <line x1="32" y1="30" x2="65" y2="55" stroke="#818cf8" stroke-width="3"/>
    <line x1="98" y1="30" x2="65" y2="55" stroke="#818cf8" stroke-width="3"/>
    <line x1="65" y1="85" x2="65" y2="55" stroke="#818cf8" stroke-width="3"/>
  </g>

  <!-- Connecting Bridge Arc -->
  <path d="M 215 200 C 270 200, 242 312, 297 312" fill="none" stroke="url(#bridge-glow)" stroke-width="12" stroke-linecap="round" filter="url(#neon-glow)"/>
  <circle cx="256" cy="256" r="10" fill="#ffffff" filter="url(#neon-glow)"/>
</svg>
